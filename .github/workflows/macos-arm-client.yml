name: macOS ARM client

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-arm-client-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CMAKE_OPTIONS: >-
    -Dclient=ON
    -Dserver=OFF
    -Dtests=OFF
    -Dsymbols=OFF
    -Dwarnings-as-errors=OFF
    -Dscreen-sharing=ON
    -Ddisplay-install-paths=ON
    -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    -DCMAKE_C_COMPILER_LAUNCHER=ccache

jobs:
  build-macos-arm-client:
    name: Build macOS ARM64 client
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build and packaging tools
        run: brew install bash dylibbundler

      - name: Set build environment
        shell: bash
        run: .github/workflows/set_environment_variables.sh "macos-15" "static" "arm64" "${{ github.workspace }}"

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.MUMBLE_ENVIRONMENT_DIR }}
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}

      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: macos-arm-client.${{ github.ref_name }}
          save: ${{ github.event_name != 'pull_request' }}
          append-timestamp: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          type: static
          os: macos-15
          arch: arm64

      - name: Build native ARM64 client
        shell: bash
        env:
          MUMBLE_BUILD_NUMBER: ${{ github.run_number }}
        run: .github/workflows/build.sh "macos-15" "static" "arm64"

      - name: Prepare portable application bundle
        shell: bash
        run: |
          version="$(./scripts/mumble-version.py).${GITHUB_RUN_NUMBER}"
          python3 macx/scripts/osxdist.py \
            --source-dir "${GITHUB_WORKSPACE}" \
            --binary-dir "${GITHUB_WORKSPACE}/build" \
            --only-appbundle \
            --version "${version}"

          app="${GITHUB_WORKSPACE}/build/Mumble.app"
          /usr/libexec/PlistBuddy -c 'Set :LSMinimumSystemVersion 15.0' "${app}/Contents/Info.plist"

          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app}/Contents/Info.plist")"
          executable="${app}/Contents/MacOS/${executable_name}"

          fix_files=(--fix-file "${executable}")
          while IFS= read -r -d '' candidate; do
            if [[ "${candidate}" != "${executable}" ]] && file "${candidate}" | grep -q 'Mach-O'; then
              fix_files+=(--fix-file "${candidate}")
            fi
          done < <(find "${app}" -type f -print0)

          dylibbundler \
            --bundle-deps \
            --create-dir \
            --overwrite-files \
            --no-codesign \
            "${fix_files[@]}" \
            --dest-dir "${app}/Contents/Frameworks" \
            --install-path '@executable_path/../Frameworks/'

          while IFS= read -r -d '' candidate; do
            if file "${candidate}" | grep -q 'Mach-O'; then
              codesign --force --sign - "${candidate}"
            fi
          done < <(find "${app}" -type f -print0)

          codesign --force --sign - "${app}"
          codesign --verify --deep --strict --verbose=2 "${app}"

      - name: Verify architecture and runtime dependencies
        shell: bash
        run: |
          app="${GITHUB_WORKSPACE}/build/Mumble.app"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app}/Contents/Info.plist")"
          executable="${app}/Contents/MacOS/${executable_name}"

          archs="$(lipo -archs "${executable}")"
          echo "Mumble executable architectures: ${archs}"
          if [[ " ${archs} " != *" arm64 "* || " ${archs} " == *" x86_64 "* ]]; then
            echo "Expected an ARM64-only executable, got: ${archs}" >&2
            exit 1
          fi

          arch -arm64 "${executable}" --version

          invalid=0
          while IFS= read -r -d '' candidate; do
            if ! file "${candidate}" | grep -q 'Mach-O'; then
              continue
            fi

            file "${candidate}"
            if ! lipo "${candidate}" -verify_arch arm64; then
              echo "Non-ARM64 Mach-O file: ${candidate}" >&2
              invalid=1
            fi

            while IFS= read -r dependency; do
              case "${dependency}" in
                @*|/usr/lib/*|/System/Library/*)
                  ;;
                *)
                  echo "Unbundled dependency in ${candidate}: ${dependency}" >&2
                  invalid=1
                  ;;
              esac
            done < <(otool -L "${candidate}" | tail -n +2 | awk '{ print $1 }')

            while IFS= read -r runtime_path; do
              case "${runtime_path}" in
                @*|/usr/lib/*|/System/Library/*)
                  ;;
                *)
                  echo "Build-machine runtime path in ${candidate}: ${runtime_path}" >&2
                  invalid=1
                  ;;
              esac
            done < <(otool -l "${candidate}" | awk '
              $1 == "cmd" && $2 == "LC_RPATH" { in_rpath = 1; next }
              in_rpath && $1 == "path" { print $2; in_rpath = 0 }
            ')
          done < <(find "${app}" -type f -print0)

          exit "${invalid}"

      - name: Smoke test packaged application launch
        shell: bash
        run: |
          app="${GITHUB_WORKSPACE}/build/Mumble.app"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app}/Contents/Info.plist")"
          executable="${app}/Contents/MacOS/${executable_name}"
          smoke_dir="${RUNNER_TEMP}/mumble-launch-smoke"
          settings_file="${smoke_dir}/settings.json"
          log_file="${smoke_dir}/mumble.log"
          mkdir -p "${smoke_dir}"
          printf '%s\n' '{"settings_version":1,"misc":{"audio_wizard_has_been_shown":true}}' > "${settings_file}"

          env -u XDG_RUNTIME_DIR arch -arm64 "${executable}" \
            --config "${settings_file}" \
            --no-identity \
            --no-window-states \
            --skip-settings-backup-prompt \
            > "${log_file}" 2>&1 &
          mumble_pid=$!

          cleanup() {
            if kill -0 "${mumble_pid}" 2>/dev/null; then
              kill "${mumble_pid}"
            fi
            wait "${mumble_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in 1 2 3 4 5; do
            sleep 1
            if ! kill -0 "${mumble_pid}" 2>/dev/null; then
              set +e
              wait "${mumble_pid}"
              exit_code=$?
              set -e
              cat "${log_file}"
              echo "Mumble exited during launch smoke test with code ${exit_code}." >&2
              exit 1
            fi
          done

          echo "Mumble remained alive through the launch smoke test."

      - name: Stage client archive
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          archive="${GITHUB_WORKSPACE}/dist/Mumble-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "${GITHUB_WORKSPACE}/build/Mumble.app" \
            "${archive}"
          (
            cd "${GITHUB_WORKSPACE}/dist"
            shasum -a 256 "$(basename "${archive}")" > "$(basename "${archive}").sha256"
          )

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: Mumble-macOS-arm64
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/Mumble-macOS-arm64.zip
            dist/Mumble-macOS-arm64.zip.sha256

      - name: Save dependency cache
        if: steps.dependency-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.MUMBLE_ENVIRONMENT_DIR }}
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}
