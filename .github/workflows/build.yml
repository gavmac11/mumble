name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      SIGN_WINDOWS_INSTALLER:
        description: 'Sign Windows Installer'
        required: true
        type: boolean
        default: false

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  CMAKE_OPTIONS: -Dsymbols=ON -Ddisplay-install-paths=ON -Dtest-lto=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache


jobs:

  fetch_build_number:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.fetch.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
            fetch-depth: 1
      - id: fetch
        shell: bash
        run: |
          build_version="$("${{ github.workspace }}/scripts/mumble-version.py")"
          build_number="$("${{ github.workspace }}/scripts/mumble-build-number.py" \
            --commit "${{ github.sha }}" --version "${build_version}" \
            --password "${{ secrets.BUILD_NUMBER_TOKEN }}" --default 0)"
          echo "Build Number: ${build_version}.${build_number}"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"


  build:
    name: build (${{ matrix.os }}, ${{ matrix.type }}, ${{ matrix.arch }})
    needs: [ fetch_build_number ]

    strategy:
        fail-fast: false
        matrix:
            include:
              - os: ubuntu-24.04
                type: static
                arch: x86_64
                tests: 'OFF'
              - os: ubuntu-24.04
                type: shared
                arch: x86_64
                tests: 'ON'
              - os: windows-2025-vs2026
                type: static
                arch: x86_64
                tests: 'OFF'
              - os: macos-15-intel
                type: static
                arch: x86_64
                tests: 'OFF'
            
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
      with:
          submodules: 'recursive'
          fetch-depth: 1


      # The Bash version installed on macOS is ancient. We need a newer version
    - name: Install Bash
      if: startswith(matrix.os, 'macos')
      run: brew install bash

    - name: Set environment variables
      run: $GITHUB_WORKSPACE/.github/workflows/set_environment_variables.sh "${{ matrix.os }}" "${{ matrix.type }}" "${{ matrix.arch }}" "${{ github.workspace }}"
      shell: bash

    - uses: actions/cache/restore@v5
      with:
          path: '${{ env.MUMBLE_ENVIRONMENT_DIR }}'
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}

    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.base_ref || github.ref_name }}.${{ matrix.os }}.${{ matrix.type }}
        save: ${{ github.event_name != 'pull_request' }}
        append-timestamp: false

    - uses: ./.github/actions/install-dependencies
      with:
          type: ${{ matrix.type }}
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

    - name: Build
      run: ./.github/workflows/build.sh "${{ matrix.os }}" "${{ matrix.type }}" "${{ matrix.arch }}"
      shell: bash
      env:
          MUMBLE_BUILD_NUMBER: ${{ needs.fetch_build_number.outputs.build_number }}
          MUMBLE_CI_TESTS: ${{ matrix.tests }}
          MUMBLE_CI_PACKAGING: ${{ github.event_name == 'pull_request' && 'OFF' || 'ON' }}

    - name: Test
      if: matrix.tests == 'ON'
      working-directory: ${{ github.workspace }}/build
      shell: bash
      run: ctest --output-on-failure -C $BUILD_TYPE

    - name: Verify FFmpeg installer payload
      if: startsWith(matrix.os, 'windows') && matrix.type == 'static' && github.event_name != 'pull_request'
      shell: pwsh
      run: .github/workflows/verify_windows_ffmpeg_installer.ps1 -Workspace "${{ github.workspace }}"

    - if: ${{ inputs.SIGN_WINDOWS_INSTALLER && startsWith(matrix.os, 'windows') }}
      uses: ./.github/actions/sign-binaries
      with:
          signpath-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          build-number: ${{ needs.fetch_build_number.outputs.build_number }}
          type: ${{ matrix.type }}
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

    - if: ${{ !inputs.SIGN_WINDOWS_INSTALLER && matrix.type == 'static' }}
      name: Publish
      uses: actions/upload-artifact@v7
      with:
        name: 'Mumble-${{ matrix.os }}'
        compression-level: 9
        path: |
          build/mumble
          build/Mumble.app
          build/mumble-server
          build/**/mumble*.msi
          build/**/mumble*.exe
          build/**/plugins/*.pdb
          build/**/mumble.pdb
          build/**/mumble_ol*.pdb
          build/**/mumble-server.pdb
          build/**/rnnoise.pdb
          build/**/speexdsp.pdb

      # We don't want to save the build env in a cache on a PR as caches are scoped
      # to branches and while PRs can access caches from the default branch, they
      # can't access the cache of other PRs. Hence, it is kind of a waste to save
      # the cache on a PR
    - if: ${{ matrix.type  == 'static' && github.event_name != 'pull_request' }}
      uses: actions/cache/save@v5
      with:
          path: '${{ env.MUMBLE_ENVIRONMENT_DIR }}'
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}


  build_debian_12:
    name: build (debian-12, shared, x86_64)
    needs: [ fetch_build_number ]
    runs-on: ubuntu-24.04
    container: debian:12
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
    - name: Bootstrap checkout dependencies
      run: |
        apt-get update
        apt-get install -y ca-certificates git tar xz-utils zstd

    - uses: actions/checkout@v6
      with:
          submodules: 'recursive'
          fetch-depth: 1

    - name: Set environment variables
      run: $GITHUB_WORKSPACE/.github/workflows/set_environment_variables.sh "debian-12" "shared" "x86_64" "$GITHUB_WORKSPACE"
      shell: bash

    - uses: ./.github/actions/install-dependencies
      with:
          type: shared
          os: debian-12
          arch: x86_64

    - name: Build
      run: ./.github/workflows/build.sh "debian-12" "shared" "x86_64"
      shell: bash
      env:
          MUMBLE_BUILD_NUMBER: ${{ needs.fetch_build_number.outputs.build_number }}

    - name: Test
      working-directory: ${{ github.workspace }}/build
      shell: bash
      run: ctest --output-on-failure -C $BUILD_TYPE

    - name: Verify Debian 12 runtime compatibility
      shell: bash
      run: |
        required_glibc="$(readelf --version-info build/mumble-server \
          | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
          | cut -d_ -f2 \
          | sort -Vu \
          | tail -n1)"
        system_glibc="$(getconf GNU_LIBC_VERSION | cut -d' ' -f2)"
        echo "mumble-server requires glibc ${required_glibc}; Debian 12 provides ${system_glibc}"
        if dpkg --compare-versions "$required_glibc" gt "$system_glibc"; then
          echo "mumble-server requires a newer glibc than Debian 12" >&2
          exit 1
        fi

    - name: Publish
      uses: actions/upload-artifact@v7
      with:
        name: Mumble-debian-12
        compression-level: 9
        path: |
          build/mumble
          build/mumble-server
