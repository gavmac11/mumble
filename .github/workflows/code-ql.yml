name: Security

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  CMAKE_OPTIONS: |
      -Dtests=OFF -Dsymbols=ON -Dwarnings-as-errors=OFF

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
          submodules: 'recursive'

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
          languages: python, cpp

    - uses: ./.github/actions/install-dependencies
      with:
          type: shared
          os: ubuntu-latest
          arch: x86_64

    - name: Create build dir
      run: cmake -E make_directory "${GITHUB_WORKSPACE}/build-codeql"

    - name: Run CMake
      run: |
          cmake -G Ninja -S "${GITHUB_WORKSPACE}" -B "${GITHUB_WORKSPACE}/build-codeql" -DCMAKE_BUILD_TYPE=Release ${CMAKE_OPTIONS} -DCMAKE_UNITY_BUILD=ON
      shell: bash

    - name: Build
      working-directory: ${{ github.workspace }}/build-codeql
      run: cmake --build . --config $BUILD_TYPE
      shell: bash

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
