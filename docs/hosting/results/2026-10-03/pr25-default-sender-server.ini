; Pilot only. Publish the container port on host loopback, not the public network.
; Runtime files belong in a dedicated disposable pilot directory.
database=/runtime/server.sqlite
dbDriver=sqlite
logfile=/runtime/server.log
host=0.0.0.0
port=64738
users=10
sslCert=/runtime/pilot.crt
sslKey=/runtime/pilot.key
autobanSuccessfulConnections=false
videobandwidth=2500000
videobandwidthaggregate=200000000
allowping=false
welcometext=Private hosting pilot
